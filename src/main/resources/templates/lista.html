<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Inmuebles registrados</title>
</head>
<body>
    <h2>Inmuebles registrados</h2>
    
    <table border="1">
        <thead>
            <tr>
                <th>Descripción</th>
                <th>Ubicación</th>
                <th>Tipo</th>
                <th>Propietario</th>
            </tr>
        </thead>
        <tbody>
            <tr th:each="inmueble : ${inmuebles}">
                <td th:text="${inmueble.description}">Descripción</td>
                <td th:text="${inmueble.city}">Ciudad</td>
                <td th:text="${inmueble.type}">Tipo</td>
                <td th:text="${inmueble.owner.name}">Propietario</td>
            </tr>
        </tbody>
    </table>
</body>
</html>
