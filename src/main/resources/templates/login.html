<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Iniciar sesión - Nester</title>
    <link rel="stylesheet" th:href="@{/css/styles.css}" href="/css/styles.css">
</head>
<body class="pagina-formulario">
    <header th:replace="~{fragments/cabecera :: cabecera}"></header>

    <main>
        <h1>Iniciar sesión</h1>

        <p class="error" th:if="${error}" th:text="${error}"></p>

        <form th:action="@{/login}" method="post">
            <label>Email
                <input type="email" name="email" required>
            </label>

            <label>Contraseña
                <input type="password" name="password" required>
            </label>

            <button type="submit">Entrar</button>
        </form>

        <p>¿No tienes cuenta? <a class="back-link" th:href="@{/registro}" href="/registro">Regístrate aquí</a></p>
        <p><a class="back-link" th:href="@{/}" href="/">Volver al inicio</a></p>
    </main>
</body>
</html>
