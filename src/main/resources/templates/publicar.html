<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Publicar inmueble - Nester</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;
            font-family: Arial, sans-serif;
            background: #f4f6f8;
            color: #202830;
        }

        .barra {
            display: flex;
            align-items: center;
            min-height: 75px;
            padding: 1rem 2rem;
            background: white;
            box-shadow: 0 2px 8px #00000014;
        }

        .barra h1 {
            margin: 0;
            color: #176b5b;
            font-size: 1.5rem;
        }

        .barra h1 a {
            color: inherit;
            text-decoration: none;
        }

        main {
            max-width: 760px;
            margin: 40px auto;
            padding: 0 20px;
        }

        main h1 {
            margin-bottom: 24px;
        }

        form {
            display: grid;
            gap: 20px;
            padding: 28px;
            background: white;
            border-radius: 12px;
            box-shadow: 0 4px 16px #00000014;
        }

        form > label {
            display: grid;
            gap: 8px;
        }

        input:not([type="checkbox"]),
        select,
        textarea {
            width: 100%;
            padding: 10px 12px;
            border: 1px solid #cbd2d9;
            border-radius: 6px;
            font: inherit;
        }

        textarea {
            min-height: 120px;
            resize: vertical;
        }

        fieldset {
            display: flex;
            flex-wrap: wrap;
            gap: 14px;
            margin: 0;
            padding: 16px;
            border: 1px solid #cbd2d9;
            border-radius: 6px;
        }

        fieldset label {
            display: flex;
            align-items: center;
            gap: 8px;
        }

        button {
            margin-top: 8px;
            padding: 12px 16px;
            border: 0;
            border-radius: 6px;
            background: #176b5b;
            color: white;
            font: inherit;
            cursor: pointer;
        }

        button:hover {
            background: #105244;
        }

        .error {
            padding: 12px;
            border-radius: 6px;
            background: #fdeaea;
            color: #a12626;
        }

        .back-link {
            display: inline-block;
            margin-top: 20px;
            color: #176b5b;
        }

        @media (max-width: 480px) {
            .barra {
                padding: 1rem;
            }

            form {
                padding: 20px;
            }
        }
    </style>
</head>
<body>
    <header class="barra">
        <h1><a th:href="@{/}">Nester</a></h1>
    </header>

    <main>
        <h1>Publicar inmueble</h1>

        <p class="error" th:if="${error}" th:text="${error}"></p>

        <form th:action="@{/propiedades/nueva}" method="post">
            <label>
                Título
                <input type="text" name="title" required>
            </label>

            <label>
                País
                <input type="text" name="country" required>
            </label>

            <label>
                Ciudad
                <input type="text" name="city" required>
            </label>

            <label>
                Código postal
                <input type="text" name="postalCode" required>
            </label>

            <label>
                Dirección
                <input type="text" name="address" required>
            </label>

            <label>
                Tipo
                <select name="type" required>
                    <option value="" disabled selected>Selecciona un tipo</option>
                    <option th:each="tipo : ${tipos}"
                            th:value="${tipo}"
                            th:text="${tipo}">
                    </option>
                </select>
            </label>

            <label>
                Habitaciones
                <input type="number" name="bedrooms" min="0" required>
            </label>

            <label>
                Camas
                <input type="number" name="beds" min="0" required>
            </label>

            <label>
                Baños
                <input type="number" name="bathrooms" min="0" required>
            </label>

            <label>
                Capacidad de huéspedes
                <input type="number" name="guestCapacity" min="1" required>
            </label>

            <fieldset>
                <legend>Complementos</legend>

                <label th:each="complemento : ${complementosDisponibles}">
                    <input type="checkbox"
                           name="complements"
                           th:value="${complemento}">
                    <span th:text="${complemento}"></span>
                </label>
            </fieldset>

            <label>
                Descripción
                <textarea name="description" maxlength="2000" required></textarea>
            </label>

            <label>
                Precio por noche (€)
                <input type="number"
                       name="pricePerNight"
                       min="0.01"
                       step="0.01"
                       required>
            </label>

            <button type="submit">Publicar inmueble</button>
        </form>

        <a class="back-link" th:href="@{/lista}">Volver a los inmuebles</a>
    </main>
</body>
</html>
