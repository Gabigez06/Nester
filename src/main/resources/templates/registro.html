<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Registro - Nester</title>
    <style>
        * { box-sizing: border-box; }
        body { margin: 0; min-height: 100vh; font-family: Arial, sans-serif; background: #f4f6f8; color: #202830; }
        .barra { display: flex; align-items: center; min-height: 75px; padding: 1rem 2rem; background: white; box-shadow: 0 2px 8px #00000014; }
        .barra h1 { margin: 0; color: #176b5b; font-size: 1.5rem; }
        .barra h1 a { color: inherit; text-decoration: none; }
        main { max-width: 520px; margin: 40px auto; padding: 0 20px; }
        main h1 { margin-bottom: 24px; }
        form { display: grid; gap: 20px; padding: 28px; background: white; border-radius: 12px; box-shadow: 0 4px 16px #00000014; }
        form > label { display: grid; gap: 8px; }
        input, select { width: 100%; padding: 10px 12px; border: 1px solid #cbd2d9; border-radius: 6px; font: inherit; }
        button { margin-top: 8px; padding: 12px 16px; border: 0; border-radius: 6px; background: #176b5b; color: white; font: inherit; cursor: pointer; }
        button:hover { background: #105244; }
        .error { padding: 12px; border-radius: 6px; background: #fdeaea; color: #a12626; }
        .back-link { color: #176b5b; }
        @media (max-width: 480px) { .barra { padding: 1rem; } form { padding: 20px; } }
    </style>
</head>
<body>
    <header class="barra">
        <h1><a th:href="@{/}" href="/">Nester</a></h1>
    </header>
    <main>
        <h1>Registro</h1>
        <p class="error" th:if="${error}" th:text="${error}"></p>
        <form th:action="@{/registro}" method="post">
            <label>Nombre
                <input name="name" required>
            </label>
            <label>Apellidos
                <input name="surname" required>
            </label>
            <label>Email
                <input name="email" type="email" required>
            </label>
            <label>Teléfono
                <input name="phone" required>
            </label>
            <label>Contraseña
                <input name="password" type="password" required>
            </label>
            <label>Tipo de usuario
                <select name="role" required>
                    <option value="INQUILINO">Inquilino</option>
                    <option value="PROPIETARIO">Propietario</option>
                </select>
            </label>
            <button type="submit">Registrarse</button>
        </form>
        <p>¿Ya tienes cuenta? <a class="back-link" th:href="@{/login}" href="/login">Inicia sesión</a></p>
        <p><a class="back-link" th:href="@{/}" href="/">Volver al inicio</a></p>
    </main>
</body>
</html>
